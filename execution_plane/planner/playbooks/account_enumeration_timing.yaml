{
  "id": "account_enumeration_timing",
  "attack_class": "account_enumeration_timing",
  "preconditions": {
    "path_contains_any": ["/login", "/register", "/forgot-password", "/forgot_password", "/check-email", "/check_email", "/reset-password"]
  },
  "steps": [
    {
      "id": "timing_probe",
      "action": "timing_oracle_probe",
      "identity_selector": "current_user",
      "probe_template": {
        "mode": "timing",
        "template": "enumerate_identifiers_timing",
        "min_sample_pairs": 10,
        "read_only": true,
        "allowed_methods": ["POST"],
        "note": "only_measure_response_time_do_not_authenticate"
      },
      "expected_signal": "statistically significant timing delta between existing and non-existing identifiers",
      "observe_only": true,
      "max_attempts": 20
    }
  ],
  "validators": {
    "timing_oracle_validator": {"signal": "timing_differential_gt_2sigma"}
  },
  "safety_budget": {
    "max_requests": 20,
    "max_attempts_per_step": 20,
    "rate_limit_rps": 1.0,
    "scope": "current_endpoint",
    "proof_gate": "default",
    "safe_fixture_required": false,
    "read_only": true
  }
}
