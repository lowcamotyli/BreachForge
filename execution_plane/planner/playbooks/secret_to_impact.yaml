{
  "id": "secret_to_impact",
  "attack_class": "sensitive_exposure",
  "preconditions": {
    "methods": ["GET", "POST"],
    "structured_response": true,
    "path_contains_any": ["/api/", "/data/", "/export/", "/report/", "/profile/"]
  },
  "steps": [
    {
      "id": "classify",
      "action": "classify_exposure_metadata",
      "identity_selector": "current_user",
      "probe_template": {
        "mode": "observe",
        "template": "classify_exposure_without_value_capture",
        "allowed_methods": ["GET", "POST"],
        "variables": {
          "classification_mode": "metadata_only"
        }
      },
      "expected_signal": "response contains credential-like class metadata without storing raw value",
      "validator": "exposure_classification_validator",
      "max_attempts": 1
    },
    {
      "id": "handoff",
      "action": "bounded_read_only_replay_handoff",
      "identity_selector": "current_user",
      "probe_template": {
        "mode": "observe",
        "template": "handoff_reference_only",
        "allowed_methods": ["GET"]
      },
      "expected_signal": "read-only impact handoff is available without embedding raw credential material",
      "observe_only": true,
      "max_attempts": 1
    },
    {
      "id": "blast_radius",
      "action": "blast_radius_reference_mapping",
      "identity_selector": "current_user",
      "probe_template": {
        "mode": "observe",
        "template": "map_read_only_impact_candidates",
        "allowed_methods": ["GET"]
      },
      "expected_signal": "same-origin read-only candidates can be ranked for later validated impact",
      "observe_only": true,
      "max_attempts": 1
    }
  ],
  "validators": {
    "exposure_classification_validator": {"signal": "credential_class_fingerprint_only"}
  },
  "safety_budget": {
    "max_requests": 3,
    "max_attempts_per_step": 1,
    "rate_limit_rps": 0.5,
    "scope": "current_endpoint",
    "proof_gate": "default"
  }
}
