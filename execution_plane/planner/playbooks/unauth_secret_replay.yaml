id: unauth_secret_replay
attack_class: sensitive_exposure
preconditions:
  requires_finding: sensitive_exposure
  methods:
    - GET
  in_scope_only: true
steps:
  - id: extract_discovered_token
    action: extract_token_from_finding
    identity_selector: discovered_token
    probe_template:
      mode: observe
      template: extract_bearer_or_api_key_from_evidence
    expected_signal: discovered token present in sensitive_exposure finding evidence
    max_attempts: 1
    observe_only: true
  - id: replay_with_discovered_token
    action: safe_token_replay
    identity_selector: discovered_token
    probe_template:
      mode: observe
      template: get_only_in_scope_replay_with_discovered_token
    expected_signal: discovered token grants access to authenticated endpoint
    max_attempts: 2
    observe_only: true
validators:
  signal_validator:
    signal: discovered_token_authenticated_access
safety_budget:
  max_requests: 3
  scope: target_only
  rate_limit_rps: 0.5
  proof_gate: default
  get_only: true
  bounded_path_budget: true
