id: double_spend
attack_class: double_spend
preconditions:
  path_contains_any:
    - transfer
    - withdraw
    - debit
    - purchase
    - checkout
    - redeem
steps:
  - id: concurrent_transfer_probe
    action: concurrent_burst_probe
    identity_selector: current_user
    probe_template:
      mode: concurrent
      template: double_submit_transfer
      burst_concurrency: 2
      probe_type: race_concurrent
      safe_fixture: true
    expected_signal: both responses succeed and sum exceeds original_balance
    max_attempts: 4
    observe_only: true
  - id: reproduce_transfer
    action: concurrent_burst_probe
    identity_selector: current_user
    probe_template:
      mode: concurrent
      template: double_submit_transfer
      burst_concurrency: 2
      probe_type: race_concurrent
      safe_fixture: true
      reproduction_count: 2
    expected_signal: second burst confirms double-spend
    max_attempts: 4
    observe_only: true
validators:
  double_spend_validator:
    signal: sum_exceeds_balance
  reproducibility_required: true
safety_budget:
  max_requests: 8
  max_attempts_per_step: 4
  burst_concurrency: 2
  scope: current_endpoint
  rate_limit_rps: 1.0
  proof_gate: default
  safe_fixture_required: true
  read_only: false
