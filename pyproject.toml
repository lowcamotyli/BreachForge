[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofscan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "aiofiles>=23.0",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "alembic",
  "asyncpg",
  "redis",
  "rq",
  "playwright",
  "httpx",
  "boto3",
  "structlog",
  "pydantic>=2.0",
  "pyotp",
  "python-jose[cryptography]",
  "cryptography",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "control_plane", "storage"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
